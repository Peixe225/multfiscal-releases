<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!--robots-->
    <title>Green Cheese Imports — escolhe no story, pede no WhatsApp</title>
    <meta name="description" content="Importados, destilados, sedas, piteiras e acessórios da Green Cheese no RJ, MG, SP, ES e SC. Escolhe no story, monta a sacola e fecha o pedido no WhatsApp da loja. Dúvidas no Instagram do teu estado." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Green Cheese" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Green Cheese Imports" />
    <meta property="og:description" content="DISPONÍVEL ✅ — escolhe no story, monta a sacola e fecha o pedido no WhatsApp." />
    <meta property="og:image" content="%URL_PUBLICA%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Antes do JS: preto puro, sem flash branco no navegador do Instagram. */
      html,body{background:#000;color:#fff;margin:0}
      /* Casca: o primeiro quadro da abertura (barrinhas do story + carregador em pixel) desenhado no próprio HTML,
         para o 4G lento não ver tela preta enquanto o JS chega. O React troca tudo dentro de #raiz no primeiro render. */
      .casca{position:fixed;inset:0}
      .casca-barras{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;gap:3px}
      .casca-barras i{flex:1;height:2px;border-radius:1px;background:rgba(255,255,255,.35)}
      .casca-px{position:absolute;left:50%;top:50%;display:flex;gap:6px;transform:translate(-50%,-50%)}
      .casca-px i{width:8px;height:8px;background:#fff;opacity:.2;animation:casca 1.2s steps(1) infinite}
      .casca-px i:nth-child(2){animation-delay:.4s}
      .casca-px i:nth-child(3){animation-delay:.8s}
      @keyframes casca{0%,33%{opacity:1}34%,100%{opacity:.2}}
      @media (min-width:900px){.casca-barras{left:calc(50% - 214px);right:auto;width:428px}}
      @media (prefers-reduced-motion:reduce){.casca-px i{animation:none;opacity:.6}}
      .casca-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
      /* o JS principal não chegou em 12 s (4G que caiu no meio da carga): aviso e "tenta de novo" (recarrega). Sem script
         em linha (a CSP do .htaccess bloqueia): só CSS. Numa carga normal o React troca a casca antes e ninguém vê */
      .casca-lento{position:absolute;left:24px;right:24px;top:calc(50% + 28px);margin:0;text-align:center;font:15px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#a8a8a8;visibility:hidden;animation:casca-lento 0s 12s forwards}
      .casca-lento a{display:inline-block;padding:12px 4px;color:#fff;text-decoration:underline;text-underline-offset:3px}
      @keyframes casca-lento{to{visibility:visible}}
    </style>
  </head>
  <body>
    <div id="raiz"><div class="casca" role="status"><div class="casca-barras" aria-hidden="true"><i></i><i></i><i></i></div><div class="casca-px" aria-hidden="true"><i></i><i></i><i></i></div><span class="casca-sr">Carregando a Green Cheese…</span><p class="casca-lento">Tá demorando pra abrir. Confere a internet e <a href="">tenta de novo</a>.</p></div></div>
    <noscript><p style="font:16px system-ui;padding:24px">A Green Cheese precisa de JavaScript ligado pra montar o pedido. Chama no Instagram: @greencheese_importsrj · @greencheese_importsmg · @greencheese_importssp · @greencheese_importses · @greencheese_importssc</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
