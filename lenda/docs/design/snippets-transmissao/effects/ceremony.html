<!doctype html>
<html lang="pt-BR" data-theme="transmissao">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cerimônia de premiação</title>
<link rel="stylesheet" href="../_fonts/fonts.css">
<link rel="stylesheet" href="../../theme-transmissao.css">
<style>
  html, body { margin: 0; min-height: 100%; background: #020310; }
  .stage { position: relative; z-index: 1; min-height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; justify-items: center; padding: 28px 24px 36px; box-sizing: border-box; }
  .hd { text-align: center; }
  .event { display: inline-flex; align-items: center; gap: 12px; font: 800 15px/1 var(--font-display); letter-spacing: .3em; text-transform: uppercase; color: var(--lx-gold-hi); }
  .event::before, .event::after { content: ""; width: 36px; height: 2px; background: var(--lx-gold); }
  .and { margin-top: 14px; font: italic 700 26px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); transition: opacity var(--dur-2) var(--ease-out); }
  /* spots da gala: giram ±8° até o "envelope", depois convergem */
  .spots { position: fixed; inset: 0; pointer-events: none; }
  .spots .lx-stadium__beam { width: 520px; top: -10%; height: 120%; animation: sway 4s ease-in-out infinite alternate; }
  .spots .a { left: 8%; --r: -16deg; } .spots .b { left: calc(50% - 260px); --r: 0deg; animation-delay: -1.3s; } .spots .c { right: 8%; --r: 16deg; animation-delay: -2.6s; }
  @keyframes sway { from { transform: rotate(calc(var(--r) - 8deg)); } to { transform: rotate(calc(var(--r) + 8deg)); } }
  .revealed .spots .lx-stadium__beam { animation: none; transform: rotate(var(--to, 0deg)); transition: transform 1.2s var(--ease-out); }
  .revealed .spots .a { --to: 14deg; } .revealed .spots .c { --to: -14deg; }
  /* indicados */
  .noms { display: grid; grid-template-columns: repeat(3, 240px); gap: 22px; align-self: center; margin-top: 24px; }
  .nom { position: relative; padding: 18px 16px 16px; display: grid; justify-items: center; gap: 10px; text-align: center; transition: transform var(--dur-3) var(--ease-spring), opacity var(--dur-2) var(--ease-out), filter var(--dur-2) var(--ease-out); }
  .nom .jersey { width: 150px; height: 150px; }
  .nom .nm { font: italic 800 28px/.95 var(--font-display); text-transform: uppercase; }
  .nom .meta { display: flex; gap: 6px; }
  .nom .st { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; border-top: 1px solid rgb(255 220 150 / .14); padding-top: 10px; }
  .nom .st b { display: block; font: italic 800 24px/1 var(--font-num); font-variant-numeric: tabular-nums; }
  .revealed .nom { opacity: .35; filter: saturate(.4); transform: translateY(8px) scale(.97); }
  .revealed .nom.win { opacity: 1; filter: none; transform: translateY(-12px) scale(1.08); z-index: 2; }
  .win-name { height: 104px; display: grid; align-items: end; text-align: center; } /* espaço reservado: o nome entra sem empurrar o layout */
  .win-name .lx-t-gala { opacity: 0; transform: translateY(20px); transition: opacity var(--dur-3) var(--ease-out) .5s, transform var(--dur-3) var(--ease-spring) .5s; }
  .revealed .win-name .lx-t-gala { opacity: 1; transform: none; }
  .revealed .and { opacity: 0; }
  .acts { display: flex; gap: 10px; margin-top: 20px; }
  @media (max-width: 820px) { .noms { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; } .nom .jersey { width: 90px; height: 90px; } .nom .nm { font-size: 18px; } .nom .st { display: none; } .lx-t-gala { font-size: 64px; } }
</style>
</head>
<body>
<div class="lx-stadium lx-stadium--gala"><i class="lx-noise-layer"></i></div>
<div id="root">
  <div class="spots"><i class="lx-stadium__beam a" style="background:conic-gradient(from 163deg at 50% 0%, transparent 0deg, rgb(255 220 150 / .20) 11deg, rgb(255 236 190 / .32) 17deg, rgb(255 220 150 / .20) 23deg, transparent 34deg);filter:blur(8px)"></i><i class="lx-stadium__beam b" style="background:conic-gradient(from 163deg at 50% 0%, transparent 0deg, rgb(255 220 150 / .20) 11deg, rgb(255 236 190 / .32) 17deg, rgb(255 220 150 / .20) 23deg, transparent 34deg);filter:blur(8px)"></i><i class="lx-stadium__beam c" style="background:conic-gradient(from 163deg at 50% 0%, transparent 0deg, rgb(255 220 150 / .20) 11deg, rgb(255 236 190 / .32) 17deg, rgb(255 220 150 / .20) 23deg, transparent 34deg);filter:blur(8px)"></i></div>
  <main class="stage">
    <header class="hd">
      <div class="event">Craque do Brasileirão 2035</div>
      <div class="and" id="and">Os indicados são…</div>
    </header>
    <section class="noms" aria-live="polite" id="noms"></section>
    <div style="display:grid;justify-items:center">
      <div class="win-name"><div class="lx-t-gala lx-metal-gold lx-gold-glow" style="font-size:96px">Rafael Silva</div></div>
      <div class="acts"><button class="lx-btn lx-btn--primary" id="go">Abrir envelope</button><button class="lx-btn lx-btn--line">Pular</button></div>
    </div>
  </main>
</div>
<script>
let uid = 0;
const jersey = (b, b2, trim, ink, name, num) => { const i = ++uid; return `<svg class="jersey" viewBox="0 0 300 300" aria-hidden="true"><defs><linearGradient id="jb${i}" x1="0" x2="1"><stop offset="0" stop-color="${b2}"/><stop offset=".35" stop-color="${b}"/><stop offset=".65" stop-color="${b}"/><stop offset="1" stop-color="${b2}"/></linearGradient><clipPath id="jc${i}"><path d="M96 40 L124 29 C132 44 168 44 176 29 L204 40 L263 72 L246 126 L214 113 L214 270 C214 276 209 281 203 281 L97 281 C91 281 86 276 86 270 L86 113 L54 126 L37 72 Z"/></clipPath></defs><g clip-path="url(#jc${i})"><rect width="300" height="300" fill="url(#jb${i})"/><path d="M37 72 L46 67 L63 121 L54 126Z M263 72 L254 67 L237 121 L246 126Z" fill="${trim}"/></g><path d="M124 29 C132 48 168 48 176 29 L167 26 C160 38 140 38 133 26 Z" fill="${trim}"/><text x="150" y="104" text-anchor="middle" font-family="Barlow Condensed" font-weight="800" font-size="30" letter-spacing="3" fill="${ink}">${name}</text><text x="150" y="232" text-anchor="middle" font-family="Barlow Condensed" font-weight="800" font-size="128" fill="${ink}">${num}</text></svg>`; };
const N = [
  { n: 'Pedro', club: 'FLA', tier: 'gold', ovr: 83, j: ['#D0152F', '#8E0B1F', '#111', '#fff', 'PEDRO', '9'], s: [36, 24, 5] },
  { n: 'Silva', club: 'PAL', tier: 'gold', ovr: 84, j: ['#0A7A45', '#00502C', '#fff', '#fff', 'SILVA', '9'], s: [38, 28, 9], win: 1 },
  { n: 'Arrascaeta', club: 'FLA', tier: 'silver', ovr: 79, j: ['#D0152F', '#8E0B1F', '#111', '#fff', 'ARRASCAETA', '10'], s: [34, 11, 14] },
];
document.getElementById('noms').innerHTML = N.map((x, i) => `<article class="lx-plate lx-plate--gold lx-c-lg nom lx-anim-rise ${x.win ? 'win' : ''}" style="--i:${i}">
  ${jersey(...x.j)}<div class="nm">${x.n}</div>
  <div class="meta"><span class="lx-chip lx-chip--sm">${x.club}</span><span class="lx-ovr-s" data-tier="${x.tier}">${x.ovr}</span></div>
  <div class="st"><div><span class="lx-label">J</span><b>${x.s[0]}</b></div><div><span class="lx-label">G</span><b class="lx-hi">${x.s[1]}</b></div><div><span class="lx-label">A</span><b>${x.s[2]}</b></div></div></article>`).join('');
const reveal = () => { document.getElementById('and').textContent = 'E o vencedor é…'; setTimeout(() => document.getElementById('root').classList.add('revealed'), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1500); };
document.getElementById('go').onclick = reveal;
if (location.hash === '#reveal') reveal();
</script>
</body>
</html>
