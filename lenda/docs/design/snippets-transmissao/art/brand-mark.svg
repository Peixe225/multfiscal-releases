<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-labelledby="lx-mark-t">
  <title id="lx-mark-t">LENDA</title>
  <!-- Marca LENDA: "L" vazado num paralelogramo de ouro. Ouro lê metal-gold-1/2/4. Mínimo 24px. -->
