<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 680" width="1050" height="680" aria-hidden="true">
  <!-- NOVO · campo da partida ao vivo (Modo Imersivo), escala 1u = 10 cm (105 × 68 m).
       Coordenadas do motor de simulação: x 0..105, y 0..68 → multiplique por 10. Casa ataca → direita.
       Jogadores, bola e rastro são desenhados por cima (ver effects/live-pitch.html). -->
