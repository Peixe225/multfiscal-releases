    <rect x="4" y="4" width="92" height="132"/><line x1="4" y1="70" x2="96" y2="70"/><circle cx="50" cy="70" r="12"/>
    <rect x="24" y="4" width="52" height="20"/><rect x="38" y="4" width="24" height="7"/>
