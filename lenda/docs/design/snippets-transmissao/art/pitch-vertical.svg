  </defs>
  <rect width="100" height="140" fill="url(#lx-pv-grass)"/>
  <g fill="#fff" opacity=".035"><rect y="0" width="100" height="10"/><rect y="20" width="100" height="10"/><rect y="40" width="100" height="10"/><rect y="60" width="100" height="10"/><rect y="80" width="100" height="10"/><rect y="100" width="100" height="10"/><rect y="120" width="100" height="10"/></g>
