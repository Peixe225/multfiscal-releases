<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" width="120" height="200" role="img" aria-labelledby="lx-artilheiro-t">
  <title id="lx-artilheiro-t">Artilheiro do Brasileirão (chuteira de prata)</title>
  <!-- LENDA · tema Transmissão · arte vetorial de troféu (viewBox 120x200, base em y=196).
       Metais: stop-color/fill leem as variáveis CSS metal-(gold|silver|wood)-(1..5) do contrato; o fallback é o hex exato do mockup.
       IDs prefixados com "lx-artilheiro-" para poder inlinar vários troféus diferentes na mesma página. -->
  <defs>
    <linearGradient id="lx-artilheiro-sil" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--metal-silver-5,#4E5873)"/><stop offset="0.14" style="stop-color:var(--metal-silver-2,#B9C2D6)"/><stop offset="0.28" style="stop-color:var(--metal-silver-1,#FFFFFF)"/><stop offset="0.44" style="stop-color:var(--metal-silver-3,#A8B2C8)"/><stop offset="0.6" style="stop-color:var(--metal-silver-4,#6B7690)"/><stop offset="0.8" style="stop-color:var(--metal-silver-2,#D3DAE8)"/><stop offset="1" style="stop-color:var(--metal-silver-5,#5D6781)"/></linearGradient>
    <linearGradient id="lx-artilheiro-wood" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--metal-wood-4,#1E0F07)"/><stop offset="0.3" style="stop-color:var(--metal-wood-2,#5A3219)"/><stop offset="0.46" style="stop-color:var(--metal-wood-1,#83502B)"/><stop offset="0.7" style="stop-color:var(--metal-wood-3,#4A2813)"/><stop offset="1" style="stop-color:var(--metal-wood-5,#190B05)"/></linearGradient>
    <linearGradient id="lx-artilheiro-silv" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--metal-silver-1,#FFFFFF)"/><stop offset="0.5" style="stop-color:var(--metal-silver-2,#C4CCDC)"/><stop offset="1" style="stop-color:var(--metal-silver-4,#7D879F)"/></linearGradient>
  </defs>
