<!doctype html>
<html lang="pt-BR" data-theme="noite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LENDA · Celebration overlay (Noite)</title>
<!-- Self-contained snippet: only depends on ../theme-noite.css (tokens + .lx-* classes).
     Fonts come from @fontsource in the app; here they fall back to system fonts if not installed. -->
<link rel="stylesheet" href="../theme-noite.css">
<style>
  body { margin: 0; min-height: 100vh; }
  .app { position: relative; z-index: 1; }
  body { overflow: hidden; height: 100vh; }
  .under { position: fixed; inset: 0; display: grid; grid-template-columns: 560px 1fr; gap: 20px; padding: 70px 24px; }
  .under div { border-radius: 22px; background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border: 1px solid var(--border); }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  .lx-beam, .lx-rays { position: fixed; }
  .lx-outline-word { position: fixed; left: 50%; top: 128px; transform: translateX(-50%); }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; top: -20px; width: 8px; height: 14px; border-radius: 2px; animation: fall linear infinite; opacity: .95; }
  .confetti i.s { width: 12px; height: 5px; } .confetti i.c { width: 8px; height: 8px; border-radius: 50%; }
  @keyframes fall { from { transform: translate3d(0,-40px,0) rotate(0) rotateY(0); } to { transform: translate3d(var(--dx),110vh,0) rotate(var(--r)) rotateY(720deg); } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 34px; }
  .trophy { height: 380px; margin-top: 10px; display: flex; justify-content: center; position: relative; }
  .trophy .lx-trophy { height: 380px; position: relative; }
  .glint { position: absolute; left: 50%; top: 150px; width: 160px; height: 160px; margin-left: -96px; mix-blend-mode: screen; animation: lxn-twinkle 2.6s ease-in-out infinite;
  background: radial-gradient(circle, rgba(255,255,255,.95) 0 2px, transparent 3px), conic-gradient(from 0deg, transparent 0 40deg, rgba(255,255,255,.55) 45deg, transparent 50deg 130deg, rgba(255,255,255,.55) 135deg, transparent 140deg 220deg, rgba(255,255,255,.55) 225deg, transparent 230deg 310deg, rgba(255,255,255,.55) 315deg, transparent 320deg);
  mask-image: radial-gradient(circle, #000, transparent 55%); }
  .lx-floor { margin-top: -26px; }
  .kicker { font-size: 12px; font-weight: 800; letter-spacing: .3em; color: #9ef3c7; text-transform: uppercase; margin-top: 8px; display: flex; align-items: center; gap: 12px; }
  .kicker::before, .kicker::after { content: ''; width: 40px; height: 1px; background: linear-gradient(90deg, transparent, #9ef3c7); } .kicker::after { transform: scaleX(-1); }
  h1 { font: 900 64px/1 var(--font-display); letter-spacing: -.035em; margin: 8px 0 6px; text-align: center; }
  .sub { color: var(--text-2); font-size: 15px; margin: 0; } .sub b { color: var(--text); font-weight: 650; }
  .match { margin-top: 18px; display: flex; align-items: center; gap: 22px; padding: 12px 22px; }
  .tm { display: flex; align-items: center; gap: 12px; font: 800 18px/1 var(--font-display); min-width: 170px; } .tm.r { justify-content: flex-end; }
  .tm img { width: 44px; height: 44px; } .tm.lose { color: var(--text-3); } .tm.lose img { opacity: .6; filter: grayscale(.4); }
  .sc { text-align: center; } .sc b { font: 800 44px/1 var(--font-num); letter-spacing: .04em; } .sc b span { color: var(--text-3); margin: 0 6px; font-weight: 600; }
  .sc small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; color: var(--text-3); text-transform: uppercase; margin-top: 2px; }
  .facts { display: flex; gap: 10px; margin-top: 16px; }
  .fact { height: 40px; padding: 0 14px 0 10px; border-radius: 12px; display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; }
  .fact .ic { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; } .fact .ic svg { width: 14px; height: 14px; }
  .fact.g .ic { background: rgba(255,200,87,.16); color: var(--warning); } .fact.p .ic { background: rgba(62,230,164,.16); color: var(--positive); }
  .fact .lx-ovr-pill { height: 22px; min-width: 34px; font-size: 14px; } .fact > svg { width: 14px; height: 14px; color: var(--text-3); }
  .actions { display: flex; gap: 10px; margin-top: 22px; pointer-events: auto; }
  .corner { position: fixed; top: 22px; } .corner.tl { left: 24px; } .corner.tr { right: 24px; display: flex; gap: 8px; }
  .also { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; border-radius: 14px; } .also .lx-trophy { height: 30px; }
</style>

<script>
  /* CSS confetti fallback. In the app use canvas-confetti with the same palette:
     confetti({ particleCount: 140, spread: 80, startVelocity: 45, origin: { y: .25 }, colors: [club, club-dark, '#ffffff', '#ffd66e', '#f3c14a', club-light], disableForReducedMotion: true }) */
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const cols = ['#1fbf68', '#0b7a43', '#ffffff', '#ffd66e', '#f3c14a', '#bff5d6']; let h = '';
  for (let i = 0; i < 110; i++) { const x = rnd() * 100, d = 5 + rnd() * 6, del = -rnd() * 11, k = rnd() < .35 ? 's' : rnd() < .2 ? 'c' : '';
    h += '<i class="' + k + '" style="left:' + x.toFixed(2) + '%;background:' + cols[i % cols.length] + ';animation-duration:' + d.toFixed(2) + 's;animation-delay:' + del.toFixed(2) + 's;--dx:' + ((rnd() - .5) * 160).toFixed(0) + 'px;--r:' + (rnd() * 900 - 450).toFixed(0) + 'deg"></i>'; }
  document.getElementById('confetti').innerHTML = h;
</script>
