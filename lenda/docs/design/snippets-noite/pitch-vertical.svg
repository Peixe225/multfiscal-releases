<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 400" preserveAspectRatio="none" role="img" aria-labelledby="lx-pv-t">
  <title id="lx-pv-t">Campo (vertical) — seletor de posição</title>
  <!-- Identity › Posição. Container: aspect-ratio 328/400, radius 18px, overflow hidden,
       box-shadow inset 0 0 0 1px rgba(255,255,255,.08), 0 20px 40px -20px #000.
       Position chips are HTML (.lx-pchip) absolutely placed in % of the container:
       CA 50/11 · PE 17/19 · PD 83/19 · MEI 50/31 · ME 15/45 · MC 50/46 · MD 85/45 · VOL 50/60 · LE 15/69 · LD 85/69 · ZAG 50/77 · GOL 50/91 -->
  <defs>
    <linearGradient id="lx-pv-grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f4a2c"/><stop offset=".5" stop-color="#0c3d24"/><stop offset="1" stop-color="#0a321e"/></linearGradient>
    <radialGradient id="lx-pv-spot" cx=".5" cy=".12" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <pattern id="lx-pv-stripes" width="328" height="50" patternUnits="userSpaceOnUse"><rect width="328" height="25" fill="#fff" fill-opacity=".028"/></pattern>
  </defs>
  <rect width="328" height="400" fill="url(#lx-pv-grass)"/>
  <rect width="328" height="400" fill="url(#lx-pv-stripes)"/>
  <rect width="328" height="400" fill="url(#lx-pv-spot)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="1.4">
    <rect x="12" y="12" width="304" height="376" rx="2"/>
    <path d="M12 200 H316"/><circle cx="164" cy="200" r="40"/>
    <rect x="86" y="12" width="156" height="58"/><rect x="126" y="12" width="76" height="22"/><path d="M134 70 A 34 34 0 0 0 194 70"/>
    <rect x="86" y="330" width="156" height="58"/><rect x="126" y="366" width="76" height="22"/><path d="M134 330 A 34 34 0 0 1 194 330"/>
  </g>
  <circle cx="164" cy="200" r="2.4" fill="#fff" fill-opacity=".5"/>
</svg>
