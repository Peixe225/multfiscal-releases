# Perfil do OBS para a live do LENDA no TikTok (em pé, 9:16).
# Quem copia para o OBS é o live\INSTALAR-OBS.bat (com o OBS fechado). O OBS regrava este arquivo quando
# você muda algo em Configurações, e aí estes comentários somem; o que vale são os valores.
#
#   Tela:   desenha em 1080x1920 (o jogo fica nítido) e transmite em 720x1280, 30 quadros por segundo,
#           o recomendado pelo TikTok para a maioria das lives (o público assiste no celular).
#   Vídeo:  x264 a 3000 kbps (CBR), com quadro-chave a cada 2 segundos (keyint=60 a 30 fps).
#   Áudio:  AAC 128 kbps, 48 kHz, estéreo.
#
# Placa de vídeo NVIDIA, AMD ou Intel e o processador no limite? Em Configurações > Saída, troque o
# Codificador para o de hardware (NVENC, AMD ou QuickSync): ele alivia o processador, mas o modo Simples
# não deixa escolher o quadro-chave (NVENC e AMD mandam um a cada ~8 s). Para manter os 2 s, use o modo
# de saída Avançado e ponha "Intervalo de quadro-chave" em 2 s.
# PC forte e internet boa (upload de 8 Mbps ou mais)? Em Configurações > Vídeo, troque a Resolução de
# saída para 1080x1920 e, em Saída, a Taxa de bits de vídeo para 5000.

[General]
Name=LENDA

[Video]
BaseCX=1080
BaseCY=1920
OutputCX=720
OutputCY=1280
FPSType=0
FPSCommon=30
ScaleType=lanczos
ColorFormat=NV12
ColorSpace=709
ColorRange=Partial

[Output]
Mode=Simple
Reconnect=true
RetryDelay=2
MaxRetries=25

[SimpleOutput]
StreamEncoder=x264
Preset=veryfast
VBitrate=3000
UseAdvanced=true
x264Settings=keyint=60
StreamAudioEncoder=aac
ABitrate=128

[Audio]
SampleRate=48000
ChannelSetup=Stereo
