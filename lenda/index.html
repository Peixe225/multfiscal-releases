<!doctype html>
<html lang="pt-BR" data-lx-theme="noite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="LENDA — simulador de carreira de futebol. Dos 16 aos 40 anos: decisões, títulos, Bolas de Ouro e Copas do Mundo, com as tabelas reais de hoje." />
    <title>LENDA · Simulador de Carreira</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      /* pre-CSS paint: no white flash before the bundle loads */
      html, body { margin: 0; background: #07080c; color: #f4f5f8; }
      /* v3.5: a marca enquanto o jogo chega (no 4G lento, ~1 s a mais de tela preta até o React desenhar); o React troca o #root inteiro */
      .lx-pre { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font: 900 28px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: .16em; }
      .lx-pre__bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .08); overflow: hidden; position: relative; }
      .lx-pre__bar i { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, transparent, #ffe697, transparent); animation: lx-pre 1.3s ease-out infinite; }
      @keyframes lx-pre { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .lx-pre__bar i { animation: none; } }
      [data-motion='reduced'] .lx-pre__bar i { animation: none; }
    </style>
    <noscript><style>.lx-pre { display: none; }</style></noscript>
    <script>
      // apply saved settings before first paint (reduced motion / theme)
      try {
        var s = JSON.parse(localStorage.getItem('lenda:settings') || '{}');
        var st = (s && s.state && s.state.settings) || {};
        if (st.reducedMotion || (st.reducedMotion == null && matchMedia('(prefers-reduced-motion: reduce)').matches)) document.documentElement.setAttribute('data-motion', 'reduced');
        if (st.lowFx) document.documentElement.classList.add('lx-lowfx');
      } catch (e) {}
    </script>
    <!-- v3.5: no site, a medição de quem abre e sai logo (src/site/medicaoCedo.ts) entra aqui, antes da folha de estilo -->
    <!--lenda:medicao-cedo-->
  </head>
  <body>
    <div id="root"><div class="lx-pre" role="status" aria-label="Carregando o LENDA"><svg viewBox="0 0 32 32" width="64" height="64" aria-hidden="true"><defs><linearGradient id="lx-pre-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#e7b54a"/><stop offset="1" stop-color="#8a5a0c"/></linearGradient></defs><path d="M16 1.8 28.4 6.6V16c0 7.2-5.6 12.3-12.4 14.2C9.2 28.3 3.6 23.2 3.6 16V6.6z" fill="url(#lx-pre-g)"/><path d="M16 4.9 25.5 8.6V16c0 5.7-4.3 9.8-9.5 11.3C10.8 25.8 6.5 21.7 6.5 16V8.6z" fill="#0b0d12"/><path d="M12.6 10.2v11.2h7.6" stroke="url(#lx-pre-g)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="m19.6 9.2.9 1.9 2 .3-1.5 1.4.4 2-1.8-1-1.8 1 .4-2-1.5-1.4 2-.3z" fill="#fff3c4"/></svg><span>LENDA</span><span class="lx-pre__bar" aria-hidden="true"><i></i></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
