<!doctype html>
<html lang="pt-BR" data-theme="noite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="LENDA — simulador de carreira de futebol. Dos 16 aos 40 anos: decisões, títulos, Bolas de Ouro e Copas do Mundo, com as tabelas reais de hoje." />
    <title>LENDA · Simulador de Carreira</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      /* pre-CSS paint: no white flash before the bundle loads */
      html, body { margin: 0; background: #07080c; color: #f4f5f8; }
    </style>
    <script>
      // apply saved settings before first paint (reduced motion / theme)
      try {
        var s = JSON.parse(localStorage.getItem('lenda:settings') || '{}');
        var st = (s && s.state && s.state.settings) || {};
        if (st.reducedMotion || (st.reducedMotion == null && matchMedia('(prefers-reduced-motion: reduce)').matches)) document.documentElement.setAttribute('data-motion', 'reduced');
        if (st.lowFx) document.documentElement.classList.add('lx-lowfx');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
