# OmniChannel 2 em container:
#   docker compose up -d --build   ->   http://localhost:8000/painel
# Banco e anexos ficam no volume "dados" e sobrevivem a rebuild e a
# `docker compose down`; só `docker compose down -v` apaga a base.
services:
  omnichannel:
    build: .
    image: omnichannel2
    ports:
      # Só esta máquina acessa. Antes de trocar por "8000:8000" (abrir para a
      # rede), tire do ar os logins de exemplo, que valem mesmo com OMNI_DEMO=0:
      #   - administrador admin@multfiscal.com.br: a senha é OMNI_SENHA_ADMIN,
      #     lida só na primeira carga da base (sem ela, admin123);
      #   - atendente ana@multfiscal.com.br / ana12345, criada sempre.
      # Para trocar uma senha numa base que já existe: em
      # http://localhost:8000/docs, POST /api/auth/login como administrador e
      # PATCH /api/atendentes/{id} com {"senha": "..."} (ou {"ativo": false}
      # para desativar a ana), pondo "Bearer <token>" no campo authorization.
      # A chave que assina os logins é gerada no primeiro start e guardada no
      # volume; a de exemplo do .env.example é ignorada.
      - "127.0.0.1:8000:8000"
    env_file:
      # o mesmo .env do iniciar.py, se existir (chave secreta, sandbox etc.)
      - path: .env
        required: false
    environment:
      # environment vence o env_file: o .env feito para rodar fora do Docker
      # aponta o banco para ./omnichannel.db, fora do volume e sem permissão
      # de escrita no container
      OMNI_BANCO_URL: sqlite:////dados/omnichannel.db
      OMNI_PASTA_ANEXOS: /dados/anexos
      # conversas de exemplo na primeira carga; OMNI_DEMO=0 para começar limpo
      OMNI_DEMO: ${OMNI_DEMO:-1}
    volumes:
      - dados:/dados
    # tini como PID 1: repassa o sinal do `docker stop` e recolhe processos
    init: true
    restart: unless-stopped

volumes:
  dados:
